name: astrbot_plugin_llmemory
display_name: LL类神经记忆情绪系统
short_desc: 节点靠赫布学习自己连边，随时间变淡、随情绪取回；不配模型也能起来。
desc: "采用模拟神经激活的赫布学习向量库，拥有内分泌情绪系统、神游联想机制和自唤醒功能。\
  完全本地的记忆系统，日常对话完全自洽，仅反思与情绪功能可选择性另接 llm（不接也没事，插件本身有替代的量表方案，只是理解能力略差一点）。\
  此记忆系统适合日常对话，未专门设计短期上下文库所以平台上下文不要设太少。记忆主干叫流水库，它不是纯向量库。\
  聊天碎成节点落库——内容、向量、时间、来源，谁也不归类。\
  向量只当门牌，用来挑几个入口节点；真正取回靠图上的边：语义相近的连一层，三小时内先后说过的连一层，同一段来源挨着的再连一层。\
  取回时从入口沿边只走一跳，把措辞完全不像、但当时挨着说过的那条一起带出来，最多补五条。\
  这就是赫布学习——被一起取回的节点之间那条边加一分，下次更容易一起被想起；长期没人走的边按 exp(-age/τ) 往下掉，度高的枢纽不动，落到地板只降不删。\
  常走的路越走越宽，冷门的越长草但不断，这张图自己会变形状。\
  普通向量记忆是一条一条算相似度，查不到就是查不到，被用过也不会变强；这里也不压成摘要，原句都留着。\
  在这一层外面，六维情绪按真实时间涨落，翻成一句话混进提示词，低落时更愿意想起同样低落的旧事；人格与用户画像每天从原始记录蒸一次，不滚上一版；闲着从热点节点随机走几跳撞出碎片，夜里做一次长梦单独落档。\
  各模块能单独关，全关时对原来的对话零影响。这套系统是我与 liuli 使用 ai 制作。\
  如有问题可与我反馈，谢谢。"
help: 默认全自动，不需要指令。/情绪 看一眼当前六维状态。面板里 judge_mode 选 rule 就不需要任何模型配置。
version: v0.1.0
author: forliuli
repo: https://github.com/forliuli/astrbot_plugin_llmemory
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - lark
